<script>

async function login(e){
e.preventDefault()

let correo = document.getElementById("correo").value
let password = document.getElementById("password").value

try{

let res = await fetch("http://192.168.1.66:3000/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify({
correo:correo,
password:password
})
})

let data = await res.json()

if(data){
localStorage.setItem("sesion", data.nombre)
window.location.href = "./Home.html"
}else{
document.getElementById("error").innerText = "Correo o contraseña incorrectos"
}

}catch(error){
document.getElementById("error").innerText = "Error de conexión con el servidor"
}

}

</script>
