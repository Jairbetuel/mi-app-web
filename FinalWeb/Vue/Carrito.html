<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrito - GameStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://unpkg.com/vue@3"></script>

<!-- PAYPAL API -->
<script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>

<style>

body{
background:#0b0b0b;
color:white; 
font-family:Segoe UI;
}

.card{
background:#141414;
border:none;
margin-bottom:15px;
border-radius:12px;
transition:0.3s;
}

.card:hover{
box-shadow:0 0 15px cyan;
transform:scale(1.02);
}

.total{
font-size:28px;
color:cyan;
font-weight:bold;
}

.btn-cantidad{
width:30px;
height:30px;
padding:0;
}

.paypal-box{
background:#141414;
padding:20px;
border-radius:15px;
margin-top:30px;
box-shadow:0 0 20px cyan;
}

</style>

</head>

<body>

<div id="app">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-black">

<div class="container">

<a href="./Home.html" class="navbar-brand">
🎮 GameStore
</a>

<a href="./Catalogo.html" class="btn btn-outline-info">
← Volver
</a>

</div>

</nav>

<div class="container mt-5">

<h2 class="text-center mb-4">
🛒 Carrito de Compras
</h2>

<div v-if="carrito.length===0" class="text-center">

<p class="fs-4">
Tu carrito está vacío 😢
</p>

</div>

<div v-else>

<div
class="card p-3"
v-for="(p,index) in carrito"
:key="index"
>

<div class="d-flex justify-content-between align-items-center">

<div>

<h5>{{p.nombre}}</h5>

<p>$ {{p.precio}}</p>

<div class="d-flex align-items-center">

<button
@click="disminuir(index)"
class="btn btn-secondary btn-cantidad"
>
-
</button>

<span class="mx-2">
{{p.cantidad}}
</span>

<button
@click="aumentar(index)"
class="btn btn-secondary btn-cantidad"
>
+
</button>

</div>

</div>

<button
@click="eliminar(index)"
class="btn btn-danger"
>
Eliminar
</button>

</div>

</div>

<!-- PAYPAL -->
<div class="paypal-box text-center">

<p class="total">
Total: ${{ total.toFixed(2) }}
</p>

<img
src="https://www.paypalobjects.com/webstatic/icon/pp258.png"
width="120"
class="mb-3"
>

<h4 class="mb-4">
💳 Pago seguro con PayPal
</h4>

<!-- BOTÓN PAYPAL -->
<div id="paypal-button-container"></div>

<button
class="btn btn-outline-danger mt-4"
@click="vaciarCarrito"
>
🧹 Vaciar carrito
</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

Vue.createApp({

data(){

return{

carrito: JSON.parse(localStorage.getItem("carrito")) || []

}

},

mounted(){

this.carrito.forEach(p=>{

if(!p.cantidad){

p.cantidad = 1

}

})

this.guardar()

// ESPERAR A QUE PAYPAL CARGUE
setTimeout(()=>{

if(typeof paypal !== "undefined"){

this.renderPaypal()

}else{

console.error("PayPal no cargó")

}

},1000)

},

computed:{

total(){

return this.carrito.reduce(

(s,p)=>s + (Number(p.precio) * Number(p.cantidad)),

0

)

}

},

methods:{

aumentar(i){

this.carrito[i].cantidad++

this.guardar()

},

disminuir(i){

if(this.carrito[i].cantidad > 1){

this.carrito[i].cantidad--

this.guardar()

}

},

eliminar(i){

this.carrito.splice(i,1)

this.guardar()

},

vaciarCarrito(){

this.carrito = []

localStorage.removeItem("carrito")

location.reload()

},

guardar(){

localStorage.setItem(

"carrito",

JSON.stringify(this.carrito)

)

},

renderPaypal(){

paypal.Buttons({

style:{

layout:'vertical',
color:'blue',
shape:'rect',
label:'paypal'

},

createOrder: (data, actions) => {

return actions.order.create({

purchase_units:[{

amount:{

value: this.total.toFixed(2)

}

}]

})

},

onApprove: (data, actions) => {

return actions.order.capture().then(details => {

alert(

"✅ Pago completado por " +

details.payer.name.given_name

)

this.carrito = []

localStorage.removeItem("carrito")

location.reload()

})

},

onError: (err) => {

console.error(err)

alert("❌ Error con PayPal")

}

}).render('#paypal-button-container')

}

}

}).mount("#app")

</script>

</body>
</html>
