<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrito - GameStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3"></script>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>

<style>

body{
background:
linear-gradient(rgba(0,0,0,.92),rgba(0,0,0,.96)),
url("https://images.unsplash.com/photo-1542751371-adc38448a05e");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
font-family:Segoe UI;
min-height:100vh;
}

.navbar{
background:#050505 !important;
box-shadow:0 0 20px cyan;
padding:15px;
}

.navbar-brand{
font-size:28px;
font-weight:bold;
color:cyan !important;
text-shadow:0 0 12px cyan;
}

.titulo{
text-align:center;
font-size:45px;
font-weight:bold;
margin-bottom:40px;
color:cyan;
text-shadow:0 0 20px cyan;
}

.card-carrito{
background:rgba(20,20,20,.92);
border-radius:22px;
padding:25px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(0,255,255,.15);
transition:.4s;
border:1px solid rgba(0,255,255,.12);
}

.card-carrito:hover{
transform:translateY(-5px);
box-shadow:0 0 30px cyan;
}

.game-name{
font-size:25px;
font-weight:bold;
margin-bottom:10px;
}

.game-price{
font-size:24px;
font-weight:bold;
color:#00ffff;
}

.btn-cantidad{
width:45px;
height:45px;
font-size:22px;
font-weight:bold;
border-radius:50%;
border:none;
}

.total-box{
background:rgba(20,20,20,.95);
padding:35px;
border-radius:25px;
box-shadow:0 0 35px rgba(0,255,255,.2);
margin-top:40px;
}

.total{
font-size:40px;
font-weight:bold;
color:cyan;
text-shadow:0 0 10px cyan;
}

.form-control{
background:#111;
border:none;
color:white;
border-radius:15px;
padding:15px;
}

.form-control:focus{
background:#111;
color:white;
box-shadow:0 0 15px cyan;
}

.btn-whatsapp{
background:linear-gradient(45deg,#25D366,#1ebe5d);
border:none;
font-weight:bold;
font-size:18px;
padding:14px;
border-radius:18px;
width:100%;
margin-top:20px;
}

.btn-danger{
border-radius:15px;
}

.paypal-box{
background:rgba(15,15,15,.95);
padding:25px;
border-radius:25px;
margin-top:30px;
box-shadow:0 0 25px rgba(0,255,255,.15);
}

.empty-box{
background:rgba(20,20,20,.92);
padding:60px;
border-radius:25px;
text-align:center;
box-shadow:0 0 20px rgba(0,255,255,.15);
}

</style>

</head>

<body>

<div id="app">

<nav class="navbar navbar-dark">

<div class="container">

<a href="./Home.html" class="navbar-brand">
🎮 GameStore
</a>

<a
href="./Catalogo.html"
class="btn btn-outline-info"
>
← Volver
</a>

</div>

</nav>

<div class="container mt-5">

<h2 class="titulo">
🛒 Carrito de Compras
</h2>

<div
v-if="carrito.length===0"
class="empty-box"
>

<h2>
😢 Tu carrito está vacío
</h2>

<p class="mt-3">
Agrega videojuegos para comenzar tu compra
</p>

<a
href="./Catalogo.html"
class="btn btn-info mt-3"
>
Ir al catálogo 🎮
</a>

</div>

<div v-else>

<div
class="card-carrito"
v-for="(p,index) in carrito"
:key="index"
>

<div class="d-flex justify-content-between align-items-center flex-wrap">

<div>

<h3 class="game-name">
{{ p.nombre }}
</h3>

<p>
🎮 Nuevo compatible solo para Xbox
</p>

<p class="game-price">
$ {{ p.precio }}
</p>

</div>

<div class="d-flex align-items-center gap-3">

<button
@click="disminuir(index)"
class="btn btn-secondary btn-cantidad"
>
-
</button>

<h4>
{{ p.cantidad }}
</h4>

<button
@click="aumentar(index)"
class="btn btn-info btn-cantidad"
>
+
</button>

<button
@click="eliminar(index)"
class="btn btn-danger"
>
Eliminar
</button>

</div>

</div>

</div>

<div class="total-box text-center">

<h2 class="total">
Total: ${{ total.toFixed(2) }}
</h2>

<div class="mt-4">

<label class="mb-2">
📱 Número de teléfono
</label>

<input
type="text"
v-model="telefono"
class="form-control"
placeholder="9511234567"
>

</div>

<button
@click="confirmarWhatsapp"
class="btn btn-whatsapp"
>
📲 Confirmar compra por WhatsApp
</button>

<div class="paypal-box">

<img
src="https://www.paypalobjects.com/webstatic/icon/pp258.png"
width="140"
class="mb-3"
>

<h4 class="mb-4">
💳 Pago seguro con PayPal
</h4>

<div id="paypal-button-container"></div>

<button
class="btn btn-outline-danger mt-4"
@click="vaciarCarrito"
>
🧹 Vaciar carrito
</button>

</div>

</div>

</div>

</div>
<script>

Vue.createApp({

data(){

return{

carrito:
JSON.parse(
localStorage.getItem("carrito")
) || [],

telefono:""

}

},

mounted(){

this.carrito.forEach(p=>{

if(!p.cantidad){

p.cantidad = 1

}

})

this.guardar()

setTimeout(()=>{

if(typeof paypal !== "undefined"){

this.renderPaypal()

}else{

console.error(
"PayPal no cargó"
)

}

},1000)

},

computed:{

total(){

return this.carrito.reduce(

(s,p)=>

s +

(Number(p.precio)
*
Number(p.cantidad)),

0

)

}

},

methods:{

aumentar(i){

this.carrito[i].cantidad++

this.guardar()

},

disminuir(i){

if(
this.carrito[i].cantidad > 1
){

this.carrito[i].cantidad--

this.guardar()

}

},

eliminar(i){

this.carrito.splice(i,1)

this.guardar()

},

vaciarCarrito(){

this.carrito=[]

localStorage.removeItem(
"carrito"
)

location.reload()

},

guardar(){

localStorage.setItem(

"carrito",

JSON.stringify(
this.carrito
)

)

},

confirmarWhatsapp(){

if(!this.telefono){

alert(
"Ingresa tu teléfono"
)

return

}

const productos =

this.carrito.map(p=>

`🎮 ${p.nombre}
x${p.cantidad}
- $${p.precio}`

).join('%0A')

const mensaje =

`🎮 Hola GameStore!

Quiero confirmar mi compra.

📱 Teléfono:
${this.telefono}

🛒 Productos:
${productos}

💰 Total:
$${this.total.toFixed(2)}

Gracias 🎮`

const numero =
"529516513410"

// guardar compra para admin

const compras = JSON.parse(
localStorage.getItem("compras")
) || []

compras.push({

telefono:this.telefono,

productos:this.carrito.map(p=>({

nombre:p.nombre,
cantidad:p.cantidad,
precio:p.precio

})),

total:this.total.toFixed(2),

fecha:new Date()
.toLocaleString(),

estado:"Pendiente"

})

localStorage.setItem(

"compras",

JSON.stringify(compras)

)

// abrir whatsapp

window.open(

`https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`,

'_blank'

)

},

renderPaypal(){

paypal.Buttons({

style:{

layout:'vertical',
color:'blue',
shape:'rect',
label:'paypal'

},

createOrder:
(data, actions)=>{

return actions.order.create({

purchase_units:[{

amount:{

value:
this.total.toFixed(2)

}

}]

})

},

onApprove:
(data, actions)=>{

return actions.order
.capture()

.then(details=>{

alert(

"✅ Pago completado por " +

details.payer
.name
.given_name

)

this.carrito=[]

localStorage.removeItem(
"carrito"
)

location.reload()

})

},

onError:(err)=>{

console.error(err)

alert(
"❌ Error con PayPal"
)

}

}).render(

'#paypal-button-container'

)

}

}

}).mount("#app")

</script>

</body>
</html>
