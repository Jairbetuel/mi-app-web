<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro - GameStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3"></script>

<style>
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background-image:url("fondo.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
font-family:Segoe UI;
}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
}

.registro-box{
position:relative;
background:rgba(20,20,20,0.95);
padding:40px;
border-radius:15px;
width:400px;
box-shadow:0 0 25px cyan;
color:white;
}

h3{
text-align:center;
margin-bottom:20px;
color:cyan;
}

.form-control{
background:#111;
border:none;
color:white;
}

.form-control:focus{
box-shadow:0 0 10px cyan;
}

.btn-registro{
background:cyan;
border:none;
font-weight:bold;
transition:0.3s;
}

.btn-registro:hover{
background:#00bcd4;
transform:scale(1.03);
}

.mensaje-ok{
color:#00ff88;
font-weight:bold;
}

.mensaje-error{
color:#ff4d4d;
font-weight:bold;
}

.link-login{
color:cyan;
text-decoration:none;
}
</style>

</head>

<body>

<div id="app">

<div class="registro-box">

<h3>🎮 Crear Cuenta</h3>

<form @submit.prevent="registrar">

<div class="mb-3">
<label>Nombre</label>
<input type="text" v-model="nombre" class="form-control" required>
</div>

<div class="mb-3">
<label>Correo</label>
<input type="email" v-model="correo" class="form-control" required>
</div>

<div class="mb-3">
<label>Contraseña</label>
<input type="password" v-model="password" class="form-control" required>
</div>

<button class="btn btn-registro w-100">
Registrarse 🚀
</button>

<p class="mt-3 text-center" :class="tipoMensaje">
{{ mensaje }}
</p>

</form>

<div class="text-center mt-3">
<a href="./Login.html" class="link-login">← Volver al login</a>
</div>

</div>

</div>

<script>

Vue.createApp({

data(){
return{
nombre:"",
correo:"",
password:"",
mensaje:"",
tipoMensaje:""
}
},

methods:{

async registrar(){

// VALIDACIONES
if(this.nombre.length < 3){
this.mensaje="Nombre muy corto"
this.tipoMensaje="mensaje-error"
return
}

if(!this.correo.includes("@")){
this.mensaje="Correo inválido"
this.tipoMensaje="mensaje-error"
return
}

if(this.password.length < 6){
this.mensaje="Contraseña muy corta"
this.tipoMensaje="mensaje-error"
return
}

try{

const res = await fetch("http://192.168.1.66:3000/usuarios", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
nombre: this.nombre,
correo: this.correo,
password: this.password
})
})

// 🔥 VALIDAR RESPUESTA
if(!res.ok){
throw new Error("Error del servidor")
}

const data = await res.text()
console.log("Respuesta:", data)

// MENSAJE OK
this.mensaje = "Cuenta creada correctamente 🎮"
this.tipoMensaje = "mensaje-ok"

// LIMPIAR
this.nombre=""
this.correo=""
this.password=""

// REDIRECCIÓN
setTimeout(()=>{
window.location.href="./Login.html"
},1500)

}catch(error){

console.log("ERROR:", error)

this.mensaje = "Error al conectar con el servidor"
this.tipoMensaje = "mensaje-error"

}

}

}

}).mount("#app")

</script>

</body>
</html>
